{% extends 'pacientes/base.html' %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card card-custom">
            <div class="card-header card-header-custom py-3">
                <h5 class="mb-0">Nuevo Ingreso de Paciente</h5>
            </div>
            <div class="card-body bg-white p-4">
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <hr style="border-color: #C7DAD3;">
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'listar_pacientes' %}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-clinica">Guardar Ficha Médica</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
