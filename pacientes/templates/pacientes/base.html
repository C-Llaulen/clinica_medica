<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica Médica - Gestión de Pacientes</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --color-dark: #2F404F;
            --color-primary: #3894A1;
            --color-light: #F0F1EE;
            --color-accent: #C7DAD3;
        }

        body {
            background-color: var(--color-light);
            color: var(--color-dark);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .navbar-custom {
            background-color: var(--color-dark);
            box-shadow: 0 2px 10px rgba(47, 64, 79, 0.15);
        }

        .btn-clinica {
            background-color: var(--color-primary);
            border-color: var(--color-primary);
            color: #ffffff;
            font-weight: 500;
        }
        .btn-clinica:hover {
            background-color: #2b7782;
            border-color: #2b7782;
            color: #ffffff;
        }

        .card-custom {
            border: 1px solid var(--color-accent);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 12px rgba(47, 64, 79, 0.05);
        }

        .card-header-custom {
            background-color: var(--color-dark);
            color: #ffffff;
            font-weight: 600;
        }

        .table thead {
            background-color: var(--color-dark);
            color: #ffffff;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'listar_pacientes' %}">Centro Médico</a>
            <div class="navbar-nav">
                <a class="nav-link text-white active" href="{% url 'listar_pacientes' %}">Listado de Pacientes</a>
                <a class="btn btn-clinica ms-3" href="{% url 'crear_paciente' %}">+ Nuevo Paciente</a>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        {% block contenido %}
        {% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
