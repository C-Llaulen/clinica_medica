{% extends 'pacientes/base.html' %}

{% block contenido %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="mb-0 text-dark fw-bold">Listado de Pacientes</h3>
    <div>
        <a href="{% url 'crear_paciente' %}" class="btn btn-clinica me-2">+ Nuevo Paciente</a>
        <button onclick="cerrarSesion()" class="btn btn-outline-danger">Cerrar Sesión</button>
    </div>
</div>

<div class="card card-custom shadow-sm">
    <div class="card-body p-0">
        <p id="mensajeEstado" class="p-4 text-center text-muted mb-0">Cargando pacientes desde la API...</p>

        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0 d-none" id="tablaPacientes">
                <thead class="table-light">
                    <tr>
                        <th class="ps-4">ID</th>
                        <th>RUT</th>
                        <th>Nombre</th>
                        <th>Edad</th>
                        <th>Género</th>
                        <th>Teléfono</th>
                        <th>Costo Consulta</th>
                        <th class="text-center pe-4">Acciones</th>
                    </tr>
                </thead>
                <tbody id="cuerpoTabla">
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const mensajeEstado = document.getElementById('mensajeEstado');
    const tablaPacientes = document.getElementById('tablaPacientes');
    const cuerpoTabla = document.getElementById('cuerpoTabla');

    async function cargarPacientes() {
        const token = sessionStorage.getItem('token');

        if (!token) {
            window.location.href = "{% url 'login' %}";
            return;
        }

        try {
            const respuesta = await fetch('/api/pacientes/', {
                method: 'GET',
                headers: {
                    'Authorization': `Token ${token}`
                }
            });

            if (respuesta.status === 401 || respuesta.status === 403) {
                sessionStorage.removeItem('token');
                window.location.href = "{% url 'login' %}";
                return;
            }

            if (!respuesta.ok) {
                throw new Error('Error al consultar los registros.');
            }

            const pacientes = await respuesta.json();
            cuerpoTabla.replaceChildren();

            if (pacientes.length === 0) {
                mensajeEstado.textContent = 'No hay pacientes registrados en el sistema.';
                mensajeEstado.classList.remove('d-none');
                tablaPacientes.classList.add('d-none');
                return;
            }

            mensajeEstado.classList.add('d-none');
            tablaPacientes.classList.remove('d-none');

            pacientes.forEach(p => {
                const fila = document.createElement('tr');

                fila.innerHTML = `
                    <td class="ps-4 fw-bold">${p.id}</td>
                    <td>${p.rut}</td>
                    <td>${p.nombre}</td>
                    <td>${p.edad} años</td>
                    <td>${p.genero}</td>
                    <td>${p.telefono}</td>
                    <td>$${p.costo_consulta.toLocaleString('es-CL')}</td>
                    <td class="text-center pe-4">
                        <a href="/editar/${p.id}/" class="btn btn-sm btn-outline-primary me-1">Editar</a>
                        <button onclick="eliminarPaciente(${p.id}, '${p.nombre}')" class="btn btn-sm btn-outline-danger">Eliminar</button>
                    </td>
                `;

                cuerpoTabla.appendChild(fila);
            });

        } catch (error) {
            mensajeEstado.textContent = 'No se pudo conectar con el servidor API.';
            mensajeEstado.classList.remove('d-none');
            console.error(error);
        }
    }

    async function eliminarPaciente(id, nombre) {
        const token = sessionStorage.getItem('token');
        if (!token) {
            window.location.href = "{% url 'login' %}";
            return;
        }

        const confirmar = confirm(`¿Estás seguro de que deseas eliminar a ${nombre} (ID: ${id})?`);
        if (!confirmar) return;

        try {
            const respuesta = await fetch(`/api/pacientes/${id}/`, {
                method: 'DELETE',
                headers: {
                    'Authorization': `Token ${token}`
                }
            });

            if (respuesta.status === 204) {
                cargarPacientes();
            } else if (respuesta.status === 401 || respuesta.status === 403) {
                sessionStorage.removeItem('token');
                window.location.href = "{% url 'login' %}";
            } else {
                alert('No se pudo eliminar el registro.');
            }
        } catch (error) {
            console.error('Error al eliminar:', error);
            alert('Error de conexión al eliminar el paciente.');
        }
    }

    function cerrarSesion() {
        sessionStorage.removeItem('token');
        sessionStorage.removeItem('username');
        window.location.href = "{% url 'login' %}";
    }

    cargarPacientes();
</script>
{% endblock %}
