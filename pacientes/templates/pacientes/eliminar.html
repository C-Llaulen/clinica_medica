{% extends 'pacientes/base.html' %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card card-custom border-danger">
            <div class="card-header bg-danger text-white py-3">
                <h5 class="mb-0">Dar de Baja Ficha Médica</h5>
            </div>
            <div class="card-body bg-white text-center p-4">
                <p class="fs-5 text-dark mb-4">¿Confirmas la eliminación permanente de este registro?</p>
                <div class="p-3 mb-4 rounded" style="background-color: #F0F1EE; border: 1px solid #C7DAD3;">
                    <h5 style="color: #2F404F;" class="mb-1">{{ paciente.nombre }}</h5>
                    <p class="text-muted mb-0">RUT: {{ paciente.rut }}</p>
                </div>
                <form method="POST">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger px-4">Eliminar definitivamente</button>
                    <a href="{% url 'listar_pacientes' %}" class="btn btn-outline-secondary ms-2">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
